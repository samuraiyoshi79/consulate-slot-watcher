name: Consulate slot watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（GitHub側の混雑で数分遅れることがある）
  workflow_dispatch:          # Actions タブから手動実行もできる
    inputs:
      test:
        description: "テスト通知を送る"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - run: python slot_watcher.py ${{ inputs.test && '--test' || '--once' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_DATES: ${{ secrets.TARGET_DATES }}
